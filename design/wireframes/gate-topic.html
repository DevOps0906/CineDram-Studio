<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관문 ① 소재 — CineDram Studio 시안</title>
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_app.css">
</head>
<body data-page="gate-topic">
<main class="main">
  <div class="page-head">
    <div>
      <h1 class="page-title">관문 ① 소재 선택</h1>
      <p class="page-sub muted"><span class="badge b-comp">한드짜</span> 달빛 수선소 · E04 · 새 소재 · 후보 3개</p>
    </div>
    <span class="label muted num">소재 선정 완료 · 11분 7초</span>
  </div>

  <form class="grid grid-3" role="radiogroup" aria-label="소재 후보" onsubmit="return false">
    <label class="card pick">
      <input type="radio" name="topic" checked>
      <div class="card-head"><span class="radio-dot"></span><strong>후보 1</strong><span class="end label muted">추천</span></div>
      <div class="row"><span class="score">87</span><span class="label muted">점 / 100</span></div>
      <div class="row">
        <span class="badge b-comp">갈등 강도 높음</span>
        <span class="badge b-comp num">00:42–01:31</span>
        <span class="badge b-comp num">겹침 12%</span>
      </div>
      <div class="box"><span class="label">킥</span>수선을 맡긴 코트 주머니에서 10년 전 편지가 나온다.</div>
      <div class="box"><span class="label">끝 장면</span>편지를 돌려주려던 손이 멈추고, 주인이 먼저 고개를 돌린다.</div>
    </label>

    <label class="card pick">
      <input type="radio" name="topic">
      <div class="card-head"><span class="radio-dot"></span><strong>후보 2</strong></div>
      <div class="row"><span class="score">81</span><span class="label muted">점 / 100</span></div>
      <div class="row">
        <span class="badge b-comp">오해·비밀</span>
        <span class="badge b-comp num">12:05–12:48</span>
        <span class="badge b-comp num">겹침 0%</span>
      </div>
      <div class="box"><span class="label">킥</span>단골손님이 매주 같은 단추만 떼어 온다.</div>
      <div class="box"><span class="label">끝 장면</span>단추 상자 바닥에 적힌 이름 하나.</div>
    </label>

    <label class="card pick">
      <input type="radio" name="topic">
      <div class="card-head"><span class="radio-dot"></span><strong>후보 3</strong></div>
      <div class="row"><span class="score">74</span><span class="label muted">점 / 100</span></div>
      <div class="row">
        <span class="badge b-comp">가족 갈등</span>
        <span class="badge b-comp num">27:10–28:02</span>
        <span class="badge b-comp num">겹침 35%</span>
      </div>
      <div class="box"><span class="label">킥</span>동생이 가게 열쇠를 몰래 복사해 둔 사실이 드러난다.</div>
      <div class="box"><span class="label">끝 장면</span>잠긴 문 앞, 두 사람이 같은 열쇠를 든다.</div>
    </label>
  </form>

  <div class="row" style="margin-top: calc(var(--spacing) * 5); justify-content: flex-end">
    <button class="btn btn-ghost">취소</button>
    <button class="btn btn-secondary"><i data-i="refresh"></i>후보 다시 뽑기</button>
    <button class="btn btn-primary">이 소재로 진행</button>
  </div>
</main>
<aside class="aside" data-status-panel aria-label="제작 현황"></aside>
<script src="_app.js"></script>
</body>
</html>
